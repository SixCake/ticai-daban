# 策略配置 — tri_lever
# 决策链路三杠杆打板策略（入场价位闸 + E3续持闸 + 不止损）
# 独立于 v5_daban, 供监控模拟/回测对比。参数口径见 strategies/_template/SPEC.md

name: tri_lever
description: 三杠杆打板（入场价位闸pct<4% + E3续持闸E3≥0.20 + 不止损）

# ---- 账户 ----
capital: 1000000          # 初始资金（与 v5_daban 同口径, 便于对比）
benchmark: DBBNCH.XSHG    # 自建打板基准（全A等权涨幅累积）

# ---- AI feed 订阅 ----
# 只能读这里声明过的 feed(隔离规范); 未声明的调用会被拒绝并告警
feeds:
  - theme_narrative       # 题材叙事强度(apps/ai_feed.py 产出)
  - market_risk           # 市场风险标注

# ---- 框架 Mod 参数 ----
mod:
  mode: replay            # replay=历史回放 | live=盘中实时
  poll_interval: 20
  catchup: true
  fill_sim: 0.30          # 成交概率抽样（研究定稿值）
  fill_seed: 42
  order_slip: 0.005       # 高挂限价容差
